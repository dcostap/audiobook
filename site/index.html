<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf8f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Audiolibros">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Audiolibros</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="preload" href="fonts/literata.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Set the theme before the first paint, so a dark theme does not flash white. app.js keeps it up to date.
    try { var theme = JSON.parse(localStorage.getItem("audiobook:v1")).settings.theme; } catch (e) {}
    if (!theme || theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper";
    document.documentElement.dataset.theme = theme;
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view"></main>
  <audio id="audio" preload="metadata"></audio>
  <dialog id="install-help" aria-labelledby="install-title">
    <h2 id="install-title">Instalar Audiolibros</h2>
    <p>En Safari, abre Compartir y elige «Añadir a la pantalla de inicio».</p>
    <form method="dialog"><button class="button primary">Cerrar</button></form>
  </dialog>
</body>
</html>
