<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf8f3">
  <title>Audiolibros</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
  <link rel="preload" href="fonts/literata.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Set the theme before the first paint, so a dark theme does not flash white. app.js keeps it up to date.
    try { var theme = JSON.parse(localStorage.getItem("audiobook:v1")).settings.theme; } catch (e) {}
    if (!theme || theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper";
    document.documentElement.dataset.theme = theme;
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view"></main>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
